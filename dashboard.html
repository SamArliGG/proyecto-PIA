<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Mentality | Panel principal</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <div class="dashboard-wrapper">

    <!-- Barra lateral -->
    <aside class="sidebar">

      <div class="sidebar-top">
        <div class="sidebar-logo">
          <img src="images/Logo-STUDENT-MENTALITY.png" alt="Logo Student Mentality">
        </div>

        <h1 class="sidebar-title">
          <span class="title-dark">Student</span>
          <span class="title-accent">Mentality</span>
        </h1>
      </div>

      <a href="#" class="menu-button">
        <img src="images/Menu-Logo.png" alt="" class="menu-icon">
        <span>Menú</span>
      </a>

      <div class="sidebar-illustration">
        <img src="images/Bienestar-Mental.png" alt="Ilustración de bienestar mental">
      </div>

    </aside>

    <!-- Contenido principal -->
    <main class="main-content">

      <!-- Barra de navegación superior -->
      <nav class="top-nav">
        <a href="#" class="nav-item">
          <img src="images/Recomendaciones-Logo.png" alt="" class="nav-icon">
          <span>Recomendaciones</span>
        </a>
        <span class="nav-divider"></span>
        <a href="#" class="nav-item">
          <img src="images/Sobre-Logo.png" alt="" class="nav-icon">
          <span>Sobre Nosotros</span>
        </a>
      </nav>

      <!-- Saludo -->
      <section class="greeting-section">
        <div class="greeting-left">
          <div class="avatar-circle">
            <img src="images/Avatar-Logio.png" alt="Avatar del estudiante">
          </div>
          <div class="greeting-text">
            <h2>¡Hola, Nombre del estudiante!</h2>
            <p>Nos alegra tenerte aquí.</p>
          </div>
        </div>
        <div class="greeting-decoration">
          <img src="images/Lavender-2.png" alt="">
        </div>
      </section>

      <!-- Tarjetas -->
      <section class="cards-row">

        <article class="card card-peach">
          <div class="card-icon">
            <img src="images/Citas-Logo.png" alt="">
          </div>
          <div class="card-body">
            <h3>Citas</h3>
            <p>Consulta tus próximas citas programadas.</p>
          </div>
          <a href="#" class="card-arrow">
            <img src="images/Flecha.png" alt="Ver citas">
          </a>
        </article>

        <article class="card card-peach">
          <div class="card-icon">
            <img src="images/CitasP-Logo.png" alt="">
          </div>
          <div class="card-body">
            <h3>Citas Pendientes</h3>
            <p>Revisa y confirma tus citas pendientes.</p>
          </div>
          <a href="#" class="card-arrow">
            <img src="images/Flecha.png" alt="Ver citas pendientes">
          </a>
        </article>

      </section>

      <section class="cards-row cards-row-full">

        <article class="card card-lavender">
          <div class="card-icon card-icon-blue">
            <img src="images/Calendario.png" alt="">
          </div>
          <div class="card-body">
            <h3>Calendario</h3>
            <p>Visualiza tu calendario y organiza tus próximas citas.</p>
          </div>
          <a href="#" class="card-arrow">
            <img src="images/Flecha-Azul.png" alt="Ver calendario">
          </a>
        </article>

      </section>

      <!-- Íconos inferiores -->
      <div class="footer-icons">
        <a href="#" class="footer-icon">
          <img src="https://upload.wikimedia.org/wikipedia/commons/2/25/PascualBravo.svg?utm_source=es.wikipedia.org&utm_campaign=index&utm_content=original" alt="Logo institución 1">
        </a>
        <a href="#" class="footer-icon">
          <img src="https://javiera.edu.co/wp-content/uploads/2023/02/escudo-institucionalmini.png" alt="Logo institución 2">
        </a>
        <a href="#" class="footer-icon">
          <img src="images/Musica-Logo.png" alt="Música">
        </a>
      </div>

    </main>

  </div>

</body>
</html>
