<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Mentality | Iniciar sesión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page-wrapper">
    <div class="login-container">

      <!-- Columna izquierda: bienvenida -->
      <div class="welcome-panel">

        <div class="logos">
          <img src="https://javiera.edu.co/wp-content/uploads/2023/02/escudo-institucionalmini.png" alt="Logo institución 1" class="logo">
          <img src="https://upload.wikimedia.org/wikipedia/commons/2/25/PascualBravo.svg?utm_source=es.wikipedia.org&utm_campaign=index&utm_content=original" alt="Logo institución 2" class="logo">
        </div>

        <p class="welcome-text">Bienvenido a</p>
        <h1 class="brand-title">Student Mentality</h1>

        <div class="accent-line">
          <span class="accent-bar"></span>
          <span class="accent-dot"></span>
        </div>

        <p class="welcome-description">
          Un espacio creado para tu bienestar emocional,
          crecimiento personal y acompañamiento psicológico.
        </p>

        <div class="illustration">
          <img src="images/Captura de pantalla (6).png" alt="Ilustración de bienestar mental" class="illustration-img">
        </div>

      </div>

      <!-- Columna derecha: formulario -->
      <div class="form-panel">
        <div class="form-card">

          <div class="user-icon">
            <img src="https://i.pinimg.com/1200x/87/cb/51/87cb5105534eb59bda373a9bee12b26a.jpg" alt="Icono de usuario" class="user-icon-img">
          </div>

          <h2 class="form-title">Iniciar sesión</h2>
          <p class="form-subtitle">Ingresa tus credenciales para continuar</p>

          <form class="login-form">

            <div class="input-group">
              <span class="input-icon">
                <img src="https://i.pinimg.com/736x/d9/7b/bb/d97bbb08017ac2309307f0822e63d082.jpg" alt="">
              </span>
              <input type="text" placeholder="Usuario" class="form-input">
            </div>

            <div class="input-group">
              <span class="input-icon">
                <img src="https://i.pinimg.com/736x/f0/f3/f0/f0f3f016054c6cdf294cbfd8b50a8862.jpg" alt="">
              </span>
              <input type="password" placeholder="Contraseña" class="form-input">
              <span class="input-icon-right">
                <img src="https://i.pinimg.com/736x/d7/88/48/d7884809ee1643602e370ced35b420c8.jpg" alt="Mostrar contraseña">
              </span>
            </div>

            <div class="input-group">
              <span class="input-icon">
                <img src="https://i.pinimg.com/736x/9c/40/df/9c40dfa435d9f073b745252423cd3d96.jpg" alt="">
              </span>
              <input type="text" placeholder="Identificación" class="form-input">
            </div>

            <a href="dashboard.html">
             <button type="submit" class="btn-submit">
               <span>Ingresar</span>
              </button>
           </a>

          </form>

        </div>
      </div>

    </div>
  </div>

</body>
</html>
